# Loads the repo-root .env (when run from backend/) or a local one (when run from the repo root).
# The [.properties] hint is required — Boot has no built-in "dotenv:" location resolver.
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]
spring.application.name=backend
server.port=8080

anthropic.api.key=${ANTHROPIC_API_KEY}

# spring.data.mongodb.uri and jwt.secret are supplied by the imported .env above.
# Do not redeclare them here as ${...} of themselves — an importing document outranks the
# file it imports, so the self-reference wins and fails with "Circular placeholder reference".


# Browser origins allowed to call this API (comma-separated).
# Override in production, e.g. CORS_ALLOWED_ORIGINS=https://quickart.example.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

spring.mvc.async.request-timeout=120000
server.tomcat.max-http-form-post-size=20MB
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

gemini.api.keys=${GEMINI_API_KEY}

huggingface.api.token=${HUGGINGFACE_API_TOKEN}

replicate.api.token=${REPLICATE_API_TOKEN}

jwt.expiration.ms=86400000

cloudinary.cloud.name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api.key=${CLOUDINARY_API_KEY}
cloudinary.api.secret=${CLOUDINARY_API_SECRET}